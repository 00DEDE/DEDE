const COLORS = ["#f9e266", "#2491d0", "#9dd4b3", "#e8e3df", "#665d52", "#1a1513"];

const LIFE     = 10000;
const FADE_DUR =  2000;
const MIN_DIST =    40;

// Build a colored SVG data URI on the fly by injecting fill into the root svg element
function makeURI(layerInner, color) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" fill="${color}">${layerInner}</svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

new p5(function(p) {
  let shapes    = [];
  let lastShape = null;
  let drawing   = true;

  let prevX = -9999;
  let prevY = -9999;

  const statusEl = document.getElementById('status');

  function updateCursor() {
    document.body.style.cursor = drawing ? 'crosshair' : 'default';
    statusEl.textContent = drawing ? 'DRAWING' : 'PAUSED';
    statusEl.style.opacity = drawing ? '0.5' : '0.25';
  }

  p.setup = function() {
    p.createCanvas(p.windowWidth, p.windowHeight);
    p.imageMode(p.CENTER);
    updateCursor();
  };

  p.draw = function() {
    p.clear();
    const now = p.millis();

    shapes = shapes.filter(s => now - s.born < LIFE + FADE_DUR);

    for (const s of shapes) {
      if (!s.img) continue;
      const age   = now - s.born;
      const alpha = age < LIFE
        ? 255
        : p.map(age, LIFE, LIFE + FADE_DUR, 255, 0);

      p.push();
      p.translate(s.x, s.y);
      p.rotate(s.rot);
      p.tint(255, 255, 255, alpha); // only use tint for alpha
      p.image(s.img, 0, 0, s.size, s.size);
      p.pop();
    }

    p.noTint();
  };

  function spawnShape(x, y) {
    const layerInner = LAYER_INNERS[Math.floor(Math.random() * LAYER_INNERS.length)];
    const color      = COLORS[Math.floor(Math.random() * COLORS.length)];
    const uri        = makeURI(layerInner, color);

    const s = {
      img:  null, // loaded async
      x, y,
      size: 100,
      rot:  [0, Math.PI / 2, Math.PI, Math.PI * 1.5][Math.floor(Math.random() * 4)],
      born: p.millis()
    };
    shapes.push(s);
    lastShape = s;

    // Load the colored image and assign it back
    p.loadImage(uri, img => { s.img = img; });
  }

  p.mouseMoved = function() {
    if (!drawing) return;
    const dx = p.mouseX - prevX;
    const dy = p.mouseY - prevY;
    if (Math.sqrt(dx * dx + dy * dy) < MIN_DIST) return;

    spawnShape(p.mouseX, p.mouseY);
    prevX = p.mouseX;
    prevY = p.mouseY;
  };

  p.mousePressed = function() {
    if (!drawing) return;
    if (lastShape) lastShape.size += 30;
  };

  p.keyPressed = function() {
    if (p.key === 'd' || p.key === 'D') {
      drawing = !drawing;
      updateCursor();
      prevX = p.mouseX;
      prevY = p.mouseY;
    }
    if (p.key === ' ') {
      shapes = []; lastShape = null;
      return false; // prevent scrolling
    }
    if (p.key === 's' || p.key === 'S') p.saveCanvas('unesco_' + Date.now(), 'png');
  };

  p.windowResized = function() {
    p.resizeCanvas(p.windowWidth, p.windowHeight);
  };
});
