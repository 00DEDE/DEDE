<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNESCO — 80 Years</title>
  <style>
    @font-face {
      font-family: 'ABC Diatype';
      src: url('DIATYPE/ABCDiatype-Regular-Trial.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      overflow: hidden;
      background: #2490cf;
      font-family: 'ABC Diatype', sans-serif;
    }

    /* Lava lamp gradient — monotone blue */
    .splash-bg {
      position: fixed;
      inset: 0;
      background-color: #2490cf;
      background-image:
        radial-gradient(ellipse 80% 60% at 20% 25%, #3daae0 0%, transparent 65%),
        radial-gradient(ellipse 70% 50% at 80% 70%, #1b7ab8 0%, transparent 60%),
        radial-gradient(ellipse 50% 45% at 35% 70%, #57b8e8 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 70% 25%, #1a6da0 0%, transparent 50%),
        radial-gradient(ellipse 55% 75% at 50% 50%, #2da0d8 0%, transparent 60%),
        radial-gradient(ellipse 90% 45% at 65% 15%, #2490cf 0%, transparent 65%);
      background-size: 200% 200%;
      animation: lava-drift 30s ease-in-out infinite alternate;
      z-index: 0;
    }

    @keyframes lava-drift {
      0% { background-position: 0% 0%; }
      25% { background-position: 35% 55%; }
      50% { background-position: 65% 35%; }
      75% { background-position: 40% 75%; }
      100% { background-position: 100% 100%; }
    }

    /* Center icon container */
    .splash-center {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 80 year icon */
    .icon-80 {
      width: 220px;
      height: 220px;
      opacity: 0;
      animation: icon80-in 1.8s cubic-bezier(0.22, 1, 0.36, 1) 0.3s forwards;
    }

    @keyframes icon80-in {
      from { opacity: 0; transform: scale(0.85); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Ring of brand icons */
    .brand-icon {
      position: absolute;
      width: 56px;
      height: 56px;
      opacity: 0;
      pointer-events: none;
    }

    @keyframes icon-pop {
      from { opacity: 0; transform: scale(0.3) rotate(-15deg); }
      to { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    /* Skip link */
    .splash-skip {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      color: rgba(255,255,255,0.6);
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      transition: color 0.2s;
      cursor: pointer;
      opacity: 0;
      animation: skip-in 0.6s ease 1.5s forwards;
    }

    .splash-skip:hover {
      color: #fff;
    }

    @keyframes skip-in {
      from { opacity: 0; transform: translateX(-50%) translateY(8px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* Fade out overlay */
    .splash-fadeout {
      position: fixed;
      inset: 0;
      background: #fff;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }

    .splash-fadeout.active {
      opacity: 1;
      pointer-events: all;
    }
  </style>
</head>
<body>

  <div class="splash-bg"></div>

  <div class="splash-center">
    <!-- 80 year icon — loaded inline for color control -->
    <div class="icon-80" id="icon80"></div>
  </div>

  <!-- Brand icons container — populated by JS -->
  <div id="brandRing"></div>

  <a class="splash-skip" id="skipLink" href="index.html">Go to Home</a>

  <div class="splash-fadeout" id="fadeOverlay"></div>

  <script>
    // Brand hex colors
    var brandColors = ['#2490cf', '#f8e166', '#9dd3b2', '#e7e2de', '#675d52', '#1a1413'];

    // Icon files (the 4 world icons)
    var iconFiles = [
      'UNESCO_MONUMENT.svg',
      'UNESCO_NATURE.svg',
      'UNESCO_INTANGIBLE.svg',
      'UNESCO_LANGUAGE.svg'
    ];

    // Load 80-year icon, recolor white
    fetch('UNESCO_80 YEAR ICON.svg')
      .then(function(r) { return r.text(); })
      .then(function(svg) {
        // Make paths white
        var colored = svg.replace(/<svg/, '<svg style="width:100%;height:100%"');
        colored = colored.replace(/fill:\s*#[0-9a-fA-F]{3,6}/g, 'fill: rgba(255,255,255,0.9)');
        // Also handle fill attributes
        colored = colored.replace(/fill="#[0-9a-fA-F]{3,6}"/g, 'fill="rgba(255,255,255,0.9)"');
        document.getElementById('icon80').innerHTML = colored;
      });

    // Load all 4 icon SVGs, then place multiples in a ring
    var loadedSVGs = [];
    var iconFetches = iconFiles.map(function(file, idx) {
      return fetch(file)
        .then(function(r) { return r.text(); })
        .then(function(svg) { loadedSVGs[idx] = svg; });
    });

    Promise.all(iconFetches).then(function() {
      var ring = document.getElementById('brandRing');
      var cx = window.innerWidth / 2;
      var cy = window.innerHeight / 2;
      var radius = Math.min(cx, cy) * 0.58;

      // Place 16 icons in a rough circle
      var totalIcons = 16;
      var placed = [];

      for (var i = 0; i < totalIcons; i++) {
        var angle = (i / totalIcons) * Math.PI * 2 - Math.PI / 2;
        // Add randomness to radius and angle for "rough circle"
        var r = radius + (Math.random() - 0.5) * radius * 0.25;
        var a = angle + (Math.random() - 0.5) * 0.3;

        var x = cx + Math.cos(a) * r - 28;
        var y = cy + Math.sin(a) * r - 28;

        var el = document.createElement('div');
        el.className = 'brand-icon';
        el.style.left = x + 'px';
        el.style.top = y + 'px';

        // Pick a random icon from the 4
        var svgIdx = Math.floor(Math.random() * 4);
        var svg = loadedSVGs[svgIdx];

        // Pick a random brand color
        var color = brandColors[Math.floor(Math.random() * brandColors.length)];

        // Recolor svg
        var colored = svg.replace(/<svg/, '<svg style="width:100%;height:100%"');
        colored = colored.replace(/fill:\s*#[0-9a-fA-F]{3,6}/g, 'fill: ' + color);
        colored = colored.replace(/path\s*\{[^}]*\}/g, 'path { fill: ' + color + '; }');
        el.innerHTML = colored;

        // Random appear delay between 1.5s and 5s
        var delay = 1.5 + Math.random() * 3.5;
        el.style.animation = 'icon-pop 0.6s cubic-bezier(0.22, 1, 0.36, 1) ' + delay.toFixed(2) + 's forwards';

        ring.appendChild(el);
      }
    });

    // Transition to home after 7 seconds
    function goHome() {
      var overlay = document.getElementById('fadeOverlay');
      overlay.classList.add('active');
      setTimeout(function() {
        window.location.href = 'index.html';
      }, 800);
    }

    // Auto transition at 7s
    var autoTimer = setTimeout(goHome, 7000);

    // Skip link
    document.getElementById('skipLink').addEventListener('click', function(e) {
      e.preventDefault();
      clearTimeout(autoTimer);
      goHome();
    });
  </script>
</body>
</html>
