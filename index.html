<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNESCO — 80 Years</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'ABC Diatype';
      src: url('DIATYPE/ABCDiatype-Regular-Trial.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      overflow: hidden;
      background: #2490cf;
      font-family: 'ABC Diatype', sans-serif;
    }

    /* Lava lamp gradient — monotone blue, more apparent */
    .splash-bg {
      position: fixed;
      inset: 0;
      background-color: #2490cf;
      background-image:
        radial-gradient(ellipse 80% 60% at 20% 25%, #4ab8e8 0%, transparent 65%),
        radial-gradient(ellipse 70% 50% at 80% 70%, #1668a0 0%, transparent 60%),
        radial-gradient(ellipse 50% 45% at 35% 70%, #6ac4ed 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 70% 25%, #155d8a 0%, transparent 50%),
        radial-gradient(ellipse 55% 75% at 50% 50%, #3daee0 0%, transparent 60%),
        radial-gradient(ellipse 90% 45% at 65% 15%, #1b7ab8 0%, transparent 65%);
      background-size: 200% 200%;
      animation: lava-drift 30s ease-in-out infinite alternate;
      z-index: 0;
    }

    @keyframes lava-drift {
      0% { background-position: 0% 0%; }
      25% { background-position: 35% 55%; }
      50% { background-position: 65% 35%; }
      75% { background-position: 40% 75%; }
      100% { background-position: 100% 100%; }
    }

    /* Center icon container */
    .splash-center {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 80 year icon — tripled from 220px to 660px */
    .icon-80 {
      width: 480px;
      height: 480px;
      opacity: 0;
      animation: icon80-in 1.8s cubic-bezier(0.22, 1, 0.36, 1) 0.3s forwards;
    }

    @keyframes icon80-in {
      from { opacity: 0; transform: scale(0.85); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Ring of brand icons */
    .brand-icon {
      position: absolute;
      width: 56px;
      height: 56px;
      opacity: 0;
      pointer-events: none;
    }

    /* Playful entrance variants */
    @keyframes icon-bounce-in {
      0% { opacity: 0; transform: scale(0) translateY(-80px); }
      40% { opacity: 1; transform: scale(1.25) translateY(10px); }
      60% { transform: scale(0.9) translateY(-6px); }
      80% { transform: scale(1.05) translateY(2px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes icon-tumble-in {
      0% { opacity: 0; transform: rotate(-280deg) scale(0.2); }
      50% { opacity: 1; transform: rotate(25deg) scale(1.1); }
      70% { transform: rotate(-8deg) scale(0.95); }
      100% { opacity: 1; transform: rotate(0deg) scale(1); }
    }

    @keyframes icon-drop-bounce {
      0% { opacity: 0; transform: translateY(-200px) rotate(40deg); }
      45% { opacity: 1; transform: translateY(12px) rotate(-5deg); }
      65% { transform: translateY(-8px) rotate(3deg); }
      80% { transform: translateY(4px) rotate(-1deg); }
      100% { opacity: 1; transform: translateY(0) rotate(0deg); }
    }

    @keyframes icon-spring-left {
      0% { opacity: 0; transform: translateX(-160px) scale(0.4) rotate(-20deg); }
      50% { opacity: 1; transform: translateX(14px) scale(1.15) rotate(8deg); }
      70% { transform: translateX(-6px) scale(0.95) rotate(-3deg); }
      100% { opacity: 1; transform: translateX(0) scale(1) rotate(0deg); }
    }

    @keyframes icon-spring-right {
      0% { opacity: 0; transform: translateX(160px) scale(0.4) rotate(20deg); }
      50% { opacity: 1; transform: translateX(-14px) scale(1.15) rotate(-8deg); }
      70% { transform: translateX(6px) scale(0.95) rotate(3deg); }
      100% { opacity: 1; transform: translateX(0) scale(1) rotate(0deg); }
    }

    @keyframes icon-flip-in {
      0% { opacity: 0; transform: perspective(400px) rotateY(-180deg) scale(0.5); }
      55% { opacity: 1; transform: perspective(400px) rotateY(20deg) scale(1.08); }
      75% { transform: perspective(400px) rotateY(-8deg) scale(0.98); }
      100% { opacity: 1; transform: perspective(400px) rotateY(0deg) scale(1); }
    }

    /* Gentle idle wobble after landing */
    @keyframes icon-idle {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-3px) rotate(1.5deg); }
      75% { transform: translateY(2px) rotate(-1deg); }
    }

    /* Year labels */
    .splash-year {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      z-index: 15;
      font-family: 'Inter Tight', sans-serif;
      font-weight: 700;
      font-size: 100px;
      color: rgba(255, 255, 255, 0.9);
      opacity: 0;
      pointer-events: none;
    }

    .splash-year-left {
      left: 0;
      padding-left: 5vw;
    }

    .splash-year-right {
      right: 0;
      padding-right: 5vw;
    }

    @keyframes year-in {
      from { opacity: 0; transform: translateY(-50%) translateX(0) scale(0.92); }
      to { opacity: 1; transform: translateY(-50%) translateX(0) scale(1); }
    }

    /* Skip link */
    .splash-skip {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      color: rgba(255,255,255,0.6);
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      transition: color 0.2s;
      cursor: pointer;
      opacity: 0;
      animation: skip-in 0.6s ease 1.5s forwards;
    }

    .splash-skip:hover {
      color: #fff;
    }

    @keyframes skip-in {
      from { opacity: 0; transform: translateX(-50%) translateY(8px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* Fade out overlay */
    .splash-fadeout {
      position: fixed;
      inset: 0;
      background: #fff;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }

    .splash-fadeout.active {
      opacity: 1;
      pointer-events: all;
    }

    /* Mobile splash adjustments */
    @media (max-width: 768px) {
      @keyframes year-in {
        from { opacity: 0; transform: translateX(-50%) scale(0.92); }
        to { opacity: 1; transform: translateX(-50%) scale(1); }
      }
      .icon-80 {
        width: 220px;
        height: 220px;
      }
      .splash-year {
        left: 50%;
        right: auto;
        transform: translateX(-50%);
        text-align: center;
        padding: 0;
        font-size: 56px;
      }
      .splash-year-left {
        top: 12vh;
      }
      .splash-year-right {
        top: auto;
        bottom: 14vh;
      }
    }

    @media (max-width: 480px) {
      .icon-80 {
        width: 160px;
        height: 160px;
      }
      .splash-year {
        font-size: 42px;
      }
      .brand-icon {
        width: 36px !important;
        height: 36px !important;
      }
    }
  </style>
</head>
<body>

  <div class="splash-bg"></div>

  <div class="splash-center">
    <div class="icon-80" id="icon80"></div>
  </div>

  <!-- Year labels -->
  <div class="splash-year splash-year-left" id="yearLeft">1946</div>
  <div class="splash-year splash-year-right" id="yearRight">2026</div>

  <!-- Brand icons container -->
  <div id="brandRing"></div>

  <a class="splash-skip" id="skipLink" href="home.html">Go to Home</a>

  <div class="splash-fadeout" id="fadeOverlay"></div>

  <script>
    // Brand hex colors — exclude blue (#2490cf) since it matches the background
    var brandColors = ['#f8e166', '#9dd3b2', '#e7e2de', '#675d52', '#1a1413'];

    // Icon files (the 4 world icons)
    var iconFiles = [
      'UNESCO_MONUMENT.svg',
      'UNESCO_NATURE.svg',
      'UNESCO_INTANGIBLE.svg',
      'UNESCO_LANGUAGE.svg'
    ];

    // Load 80-year icon, recolor white
    fetch('UNESCO_80 YEAR ICON.svg')
      .then(function(r) { return r.text(); })
      .then(function(svg) {
        var colored = svg.replace(/<svg/, '<svg style="width:100%;height:100%"');
        colored = colored.replace(/fill:\s*#[0-9a-fA-F]{3,6}/g, 'fill: rgba(255,255,255,0.9)');
        colored = colored.replace(/fill="#[0-9a-fA-F]{3,6}"/g, 'fill="rgba(255,255,255,0.9)"');
        document.getElementById('icon80').innerHTML = colored;
      });

    // Load all 4 icon SVGs, then place in a perfect circle
    var loadedSVGs = [];
    var iconFetches = iconFiles.map(function(file, idx) {
      return fetch(file)
        .then(function(r) { return r.text(); })
        .then(function(svg) { loadedSVGs[idx] = svg; });
    });

    Promise.all(iconFetches).then(function() {
      var ring = document.getElementById('brandRing');
      var cx = window.innerWidth / 2;
      var cy = window.innerHeight / 2;
      // Responsive radius — shrink on smaller screens
      var radius = Math.min(300, Math.min(window.innerWidth, window.innerHeight) * 0.32);

      // Playful animation variants
      var animations = [
        'icon-bounce-in',
        'icon-tumble-in',
        'icon-drop-bounce',
        'icon-spring-left',
        'icon-spring-right',
        'icon-flip-in'
      ];

      var durations = [0.7, 0.8, 0.9, 1.0, 1.1];

      // Place 16 icons in a perfect circle
      var totalIcons = 16;

      // Generate random, non-sequential delays
      var delays = [];
      for (var d = 0; d < totalIcons; d++) {
        delays.push(1.2 + Math.random() * 3.8);
      }

      for (var i = 0; i < totalIcons; i++) {
        var angle = (i / totalIcons) * Math.PI * 2 - Math.PI / 2;

        var x = cx + Math.cos(angle) * radius - 28;
        var y = cy + Math.sin(angle) * radius - 28;

        var size = 48 + Math.random() * 16;

        var el = document.createElement('div');
        el.className = 'brand-icon';
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        el.style.width = size + 'px';
        el.style.height = size + 'px';

        var restRotation = (Math.random() - 0.5) * 16;
        el.dataset.restRotation = restRotation;

        // Pick a random icon from the 4
        var svgIdx = Math.floor(Math.random() * 4);
        var svg = loadedSVGs[svgIdx];

        // Pick a random brand color (blue excluded)
        var color = brandColors[Math.floor(Math.random() * brandColors.length)];

        // Recolor svg
        var colored = svg.replace(/<svg/, '<svg style="width:100%;height:100%"');
        colored = colored.replace(/fill:\s*#[0-9a-fA-F]{3,6}/g, 'fill: ' + color);
        colored = colored.replace(/path\s*\{[^}]*\}/g, 'path { fill: ' + color + '; }');
        el.innerHTML = colored;

        // Random entrance animation with random delay (not sequential)
        var anim = animations[Math.floor(Math.random() * animations.length)];
        var dur = durations[Math.floor(Math.random() * durations.length)];
        var delay = delays[i];

        el.style.animation = anim + ' ' + dur + 's cubic-bezier(0.22, 1, 0.36, 1) ' + delay.toFixed(2) + 's forwards';

        // After entrance, add idle wobble
        (function(element, d, durVal, rot) {
          setTimeout(function() {
            var wobbleDelay = (Math.random() * 2).toFixed(1);
            var wobbleDur = (3 + Math.random() * 3).toFixed(1);
            element.style.animation = 'icon-idle ' + wobbleDur + 's ease-in-out ' + wobbleDelay + 's infinite';
            element.style.opacity = '1';
            element.style.transform = 'rotate(' + rot + 'deg)';
          }, (d + durVal) * 1000 + 50);
        })(el, delay, dur, restRotation);

        ring.appendChild(el);
      }

      // Show year labels at a fixed moment — both appear together
      var yearDelay = 1.8; // seconds
      var yearLeft = document.getElementById('yearLeft');
      var yearRight = document.getElementById('yearRight');
      yearLeft.style.animation = 'year-in 1.2s cubic-bezier(0.22, 1, 0.36, 1) ' + yearDelay + 's forwards';
      yearRight.style.animation = 'year-in 1.2s cubic-bezier(0.22, 1, 0.36, 1) ' + yearDelay + 's forwards';
    });

    // Transition to home after 7 seconds
    function goHome() {
      sessionStorage.setItem('splash-seen', '1');
      var overlay = document.getElementById('fadeOverlay');
      overlay.classList.add('active');
      setTimeout(function() {
        window.location.href = 'home.html';
      }, 800);
    }

    var autoTimer = setTimeout(goHome, 7000);

    document.getElementById('skipLink').addEventListener('click', function(e) {
      e.preventDefault();
      clearTimeout(autoTimer);
      goHome();
    });
  </script>
</body>
</html>
