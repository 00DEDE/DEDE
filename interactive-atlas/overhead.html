<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNESCO Atlas — Overhead Display</title>
  <link rel="stylesheet" href="css/overhead.css">
</head>
<body>

  <div class="ambient-glow" id="ambient-glow"></div>
  <div class="transition-flash" id="transition-flash"></div>

  <!-- Intro overlay — stays until first icon activation -->
  <div class="intro-overlay" id="intro-overlay">
    <div class="intro-icons">
      <div class="intro-icon-item">
        <div class="intro-icon" style="-webkit-mask-image: url('assets/graphic/UNESCO_MONUMENT.svg'); mask-image: url('assets/graphic/UNESCO_MONUMENT.svg'); -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: center; mask-position: center; background-color: #2491d0;"></div>
        <span class="intro-icon-label" style="color: #2491d0;">Monuments</span>
      </div>
      <div class="intro-icon-item">
        <div class="intro-icon" style="-webkit-mask-image: url('assets/graphic/UNESCO_NATURE.svg'); mask-image: url('assets/graphic/UNESCO_NATURE.svg'); -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: center; mask-position: center; background-color: #9dd3b2;"></div>
        <span class="intro-icon-label" style="color: #9dd3b2;">Nature</span>
      </div>
      <div class="intro-icon-item">
        <div class="intro-icon" style="-webkit-mask-image: url('assets/graphic/UNESCO_LANGUAGE.svg'); mask-image: url('assets/graphic/UNESCO_LANGUAGE.svg'); -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: center; mask-position: center; background-color: #f8e166;"></div>
        <span class="intro-icon-label" style="color: #f8e166;">Language</span>
      </div>
      <div class="intro-icon-item">
        <div class="intro-icon" style="-webkit-mask-image: url('assets/graphic/UNESCO_INTANGIBLE.svg'); mask-image: url('assets/graphic/UNESCO_INTANGIBLE.svg'); -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: center; mask-position: center; background-color: #e7e2de;"></div>
        <span class="intro-icon-label" style="color: #e7e2de;">Intangible</span>
      </div>
    </div>
    <img class="intro-title-svg" src="assets/graphic/BLOCK_TYPE_TRANSITION TITLE.svg" alt="UNESCO Interactive Atlas">
  </div>

  <div class="overhead-wrap">

    <!-- Idle state — click unlocks audio for the session -->
    <div class="idle-state" id="idle-state" style="display:none;">
      <div class="idle-logo">A</div>
      <div class="idle-text">Click anywhere to begin</div>
    </div>

    <!-- Active content (shown on activation) -->
    <div class="active-content" id="active-content">

      <!-- Intro layer: title, icon, description — shown first, then fades out -->
      <div class="intro-layer" id="intro-layer">
        <div class="overhead-icon-wrap" id="overhead-icon-wrap">
          <img class="overhead-icon" id="overhead-icon" src="" alt="">
        </div>
        <div class="location-title" id="location-title"></div>
        <div class="accent-line" id="accent-line"></div>
        <div class="category-desc" id="category-desc"></div>
      </div>

      <!-- Persistent bar: world name + icon that reappears above it -->
      <div class="world-bar" id="world-bar">
        <img class="world-bar-icon" id="world-bar-icon" src="" alt="">
        <span class="world-bar-text" id="world-bar-text"></span>
      </div>
      <div class="zone-number" id="zone-number"></div>

      <div class="video-area">
        <div class="video-frame" id="video-frame">
          <video class="overhead-video" id="overhead-video" playsinline></video>
          <div class="video-fade-overlay" id="video-fade-overlay"></div>
        </div>
      </div>

      <div class="sequence-counter" id="sequence-counter"></div>

    </div>

  </div>

  <script src="js/overhead.js"></script>
</body>
</html>
