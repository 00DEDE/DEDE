<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNESCO Atlas — Table Display</title>
  <link rel="stylesheet" href="css/table.css">
</head>
<body>

  <div class="grid-overlay"></div>
  <div class="scan-line"></div>

  <div class="world-indicator" id="world-indicator"></div>

  <div class="map-wrap" id="map-wrap">
    <svg class="map-svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet">
      <!-- North America -->
      <path class="continent" d="M100,60 Q130,35 175,30 Q230,25 280,40 Q320,50 345,75 Q360,100 350,130 Q340,158 320,178 Q300,198 275,215 Q250,228 225,235 Q195,240 170,235 Q145,225 125,210 Q108,190 98,165 Q88,135 92,105 Z"/>
      <!-- Central America & Caribbean -->
      <path class="continent" d="M210,240 Q230,245 250,258 Q265,272 270,290 Q267,302 258,308 Q245,312 232,308 Q220,300 212,288 Q205,272 207,255 Z"/>
      <!-- South America -->
      <path class="continent" d="M260,320 Q285,308 310,315 Q335,328 348,352 Q355,382 350,415 Q342,448 330,475 Q318,500 305,520 Q292,540 282,555 Q272,565 265,560 Q258,550 252,530 Q245,505 240,478 Q235,448 232,415 Q230,382 232,350 Z"/>
      <!-- Europe -->
      <path class="continent" d="M490,55 Q515,40 545,35 Q575,35 598,48 Q612,60 608,78 Q602,98 590,110 Q578,122 562,130 Q545,136 528,138 Q512,136 500,128 Q490,118 488,102 Q486,85 490,68 Z"/>
      <!-- Africa -->
      <path class="continent" d="M510,195 Q535,182 558,190 Q580,200 598,222 Q612,248 618,278 Q622,310 618,342 Q612,375 602,402 Q590,428 575,445 Q560,455 545,450 Q530,442 518,425 Q508,402 502,375 Q498,345 498,315 Q500,282 502,252 Q505,222 508,200 Z"/>
      <!-- Asia (main mass) -->
      <path class="continent" d="M610,32 Q660,18 720,15 Q785,12 850,20 Q900,30 940,48 Q965,62 978,85 Q985,112 978,138 Q968,162 950,178 Q930,190 908,195 Q885,200 860,202 Q830,205 800,200 Q770,192 740,178 Q710,162 685,142 Q662,120 648,98 Q638,75 635,55 Z"/>
      <!-- South/Southeast Asia -->
      <path class="continent" d="M770,210 Q805,202 835,212 Q858,225 875,248 Q885,268 890,292 Q888,312 876,325 Q860,335 842,330 Q822,322 805,310 Q790,295 780,278 Q772,258 768,235 Z"/>
      <!-- Middle East -->
      <path class="continent" d="M590,155 Q615,148 640,155 Q658,165 662,182 Q658,198 648,208 Q635,215 618,212 Q602,205 592,192 Q585,178 588,162 Z"/>
      <!-- Australia -->
      <path class="continent" d="M920,395 Q955,380 990,385 Q1025,395 1048,418 Q1062,438 1058,462 Q1048,480 1030,492 Q1008,500 982,495 Q958,485 942,468 Q928,450 922,430 Q918,410 920,400 Z"/>
      <!-- New Zealand -->
      <path class="continent" d="M1068,488 Q1076,480 1084,485 Q1088,495 1086,510 Q1080,520 1072,516 Q1066,508 1068,495 Z"/>
      <!-- Indonesia archipelago -->
      <path class="continent" d="M855,340 Q878,332 902,338 Q920,348 925,362 Q922,375 910,380 Q895,385 878,382 Q862,375 856,362 Q852,350 855,340 Z"/>
      <!-- Japan -->
      <path class="continent" d="M975,75 Q985,65 992,72 Q998,85 995,102 Q988,115 980,110 Q972,100 972,88 Z"/>
      <!-- Greenland -->
      <path class="continent" d="M350,15 Q375,5 398,10 Q415,20 418,38 Q414,55 400,60 Q385,65 370,58 Q358,48 354,35 Z"/>
    </svg>

    <!-- HTML markers generated by JS -->
    <div class="markers-layer" id="markers-layer"></div>
  </div>

  <!-- Bottom context panel -->
  <div class="context-panel" id="context-panel">
    <div class="context-icon-wrap" id="context-icon-wrap">
      <div class="context-panel-icon" id="context-panel-icon"></div>
    </div>
    <div class="context-location" id="context-location">Select a zone to explore</div>
    <div class="context-region" id="context-region"></div>
    <div class="context-world" id="context-world"></div>
    <div class="context-desc" id="context-desc">Use arrow keys or click an icon to navigate through 20 UNESCO heritage sites across four worlds.</div>
  </div>

  <div class="status-bar">
    <span class="status-zone" id="status-zone">Ready</span>
    <div class="progress-dots" id="progress-dots"></div>
    <span class="status-hint">&larr; &rarr; Navigate zones</span>
  </div>

  <script src="js/table.js"></script>
</body>
</html>
