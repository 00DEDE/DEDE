<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNESCO Atlas — Table Display</title>
  <link rel="stylesheet" href="css/table.css">
</head>
<body>

  <div class="ocean-layer">
    <div class="ocean-current current-1"></div>
    <div class="ocean-current current-2"></div>
    <div class="ocean-current current-3"></div>
    <div class="ocean-current current-4"></div>
    <div class="ocean-current current-5"></div>
    <div class="ocean-current current-6"></div>
    <div class="ocean-current current-7"></div>
    <div class="ocean-current current-8"></div>
  </div>
  <img class="map-grid" src="assets/graphic/grid.svg" alt="">
  <div class="scan-line"></div>

  <div class="world-indicator" id="world-indicator"></div>

  <div class="map-wrap" id="map-wrap">
    <div class="map-container" id="map-container">
      <img class="map-continents" src="assets/graphic/continents.svg" alt="">
      <!-- HTML markers generated by JS -->
      <div class="markers-layer" id="markers-layer"></div>
    </div>
  </div>

  <!-- Bottom context panel — horizontal: icon | world | text -->
  <div class="context-panel" id="context-panel">
    <div class="context-icon-wrap" id="context-icon-wrap">
      <div class="context-panel-icon" id="context-panel-icon"></div>
    </div>
    <div class="context-world" id="context-world"></div>
    <div class="context-text">
      <div class="context-location" id="context-location"></div>
      <div class="context-region" id="context-region"></div>
      <div class="context-desc" id="context-desc"></div>
    </div>
  </div>

  <!-- Legend — bottom left -->
  <div class="legend" id="legend">
    <div class="legend-item">
      <div class="legend-icon" id="legend-icon-monuments" style="background-color: #2491d0;"></div>
      <span class="legend-label" style="color: #2491d0;">Monuments</span>
    </div>
    <div class="legend-item">
      <div class="legend-icon" id="legend-icon-nature" style="background-color: #9dd3b2;"></div>
      <span class="legend-label" style="color: #9dd3b2;">Nature</span>
    </div>
    <div class="legend-item">
      <div class="legend-icon" id="legend-icon-language" style="background-color: #f8e166;"></div>
      <span class="legend-label" style="color: #f8e166;">Language</span>
    </div>
    <div class="legend-item">
      <div class="legend-icon" id="legend-icon-intangible" style="background-color: #e7e2de;"></div>
      <span class="legend-label" style="color: #e7e2de;">Intangible</span>
    </div>
  </div>

  <!-- Intro overlay -->
  <div class="intro-overlay" id="intro-overlay">
    <div class="intro-icons">
      <div class="intro-icon-item">
        <div class="intro-icon" id="intro-icon-monuments" style="background-color: #2491d0;"></div>
        <span class="intro-icon-label" style="color: #2491d0;">Monuments</span>
      </div>
      <div class="intro-icon-item">
        <div class="intro-icon" id="intro-icon-nature" style="background-color: #9dd3b2;"></div>
        <span class="intro-icon-label" style="color: #9dd3b2;">Nature</span>
      </div>
      <div class="intro-icon-item">
        <div class="intro-icon" id="intro-icon-language" style="background-color: #f8e166;"></div>
        <span class="intro-icon-label" style="color: #f8e166;">Language</span>
      </div>
      <div class="intro-icon-item">
        <div class="intro-icon" id="intro-icon-intangible" style="background-color: #e7e2de;"></div>
        <span class="intro-icon-label" style="color: #e7e2de;">Intangible</span>
      </div>
    </div>
    <img class="intro-title-svg" src="assets/graphic/BLOCK_TYPE_TRANSITION TITLE.svg" alt="UNESCO Interactive Atlas">
  </div>

  <!-- Top-left title -->
  <img class="corner-title" src="assets/graphic/BLOCK_TYPE_TITLE.svg" alt="Title">
  <!-- Top-right UNESCO logo -->
  <img class="corner-logo" src="assets/graphic/UNESCO_LOGO.svg" alt="UNESCO">

  <div class="status-bar">
    <span class="status-zone" id="status-zone">Ready</span>
    <div class="progress-dots" id="progress-dots"></div>
    <div class="media-controls" id="media-controls">
      <button class="media-btn" id="btn-mute" title="Mute/Unmute">&#9834;</button>
      <button class="media-btn" id="btn-pause" title="Pause">&#10074;&#10074;</button>
      <button class="media-btn" id="btn-play" title="Play">&#9654;</button>
    </div>
  </div>

  <script src="js/table.js"></script>
</body>
</html>
