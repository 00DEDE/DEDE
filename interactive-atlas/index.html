<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNESCO Atlas — Table Display</title>
  <link rel="stylesheet" href="css/table.css">
</head>
<body>

  <div class="ocean-layer" id="ocean-layer"></div>
  <img class="map-grid" src="assets/graphic/grid.svg" alt="">
  <div class="scan-line"></div>

  <div class="world-indicator" id="world-indicator"></div>

  <div class="map-wrap" id="map-wrap">
    <div class="map-container" id="map-container">
      <img class="map-continents" src="assets/graphic/continents.svg" alt="">
      <!-- HTML markers generated by JS -->
      <div class="markers-layer" id="markers-layer"></div>
    </div>
  </div>

  <!-- World context panel — shown during world phase (Round 1) -->
  <div class="world-context-panel" id="world-context-panel">
    <div class="wcp-icon-wrap">
      <div class="wcp-icon" id="wcp-icon"></div>
    </div>
    <div class="wcp-text">
      <div class="wcp-eyebrow" id="wcp-eyebrow"></div>
      <div class="wcp-title" id="wcp-title"></div>
      <div class="wcp-desc" id="wcp-desc"></div>
      <div class="wcp-meta" id="wcp-meta"></div>
    </div>
  </div>

  <!-- Legend — bottom right, phase-ordered: monuments → nature → intangible → language -->
  <div class="legend" id="legend">
    <div class="legend-item" id="legend-item-monuments">
      <div class="legend-icon" id="legend-icon-monuments" style="background-color: #2491d0;"></div>
      <span class="legend-label" style="color: #2491d0;">Built<br>Monuments</span>
    </div>
    <div class="legend-item" id="legend-item-nature">
      <div class="legend-icon" id="legend-icon-nature" style="background-color: #9dd3b2;"></div>
      <span class="legend-label" style="color: #9dd3b2;">Natural<br>Sites</span>
    </div>
    <div class="legend-item" id="legend-item-intangible">
      <div class="legend-icon" id="legend-icon-intangible" style="background-color: #e7e2de;"></div>
      <span class="legend-label" style="color: #e7e2de;">Intangible<br>Traditions</span>
    </div>
    <div class="legend-item" id="legend-item-language">
      <div class="legend-icon" id="legend-icon-language" style="background-color: #f8e166;"></div>
      <span class="legend-label" style="color: #f8e166;">Endangered<br>Languages</span>
    </div>
  </div>

  <!-- Intro overlay -->
  <div class="intro-overlay" id="intro-overlay">
    <img class="intro-title-svg" src="assets/graphic/BLOCK_TYPE_TRANSITION TITLE.svg" alt="UNESCO Interactive Atlas">
    <div class="intro-icons">
      <div class="intro-icon-item">
        <div class="intro-icon" id="intro-icon-monuments" style="background-color: #2491d0;"></div>
        <span class="intro-icon-label" style="color: #2491d0;">Built Monuments</span>
      </div>
      <div class="intro-icon-item">
        <div class="intro-icon" id="intro-icon-nature" style="background-color: #9dd3b2;"></div>
        <span class="intro-icon-label" style="color: #9dd3b2;">Natural Sites</span>
      </div>
      <div class="intro-icon-item">
        <div class="intro-icon" id="intro-icon-intangible" style="background-color: #e7e2de;"></div>
        <span class="intro-icon-label" style="color: #e7e2de;">Intangible Traditions</span>
      </div>
      <div class="intro-icon-item">
        <div class="intro-icon" id="intro-icon-language" style="background-color: #f8e166;"></div>
        <span class="intro-icon-label" style="color: #f8e166;">Endangered Languages</span>
      </div>
    </div>
    <img class="intro-logo" src="assets/graphic/UNESCO_LOGO.svg" alt="UNESCO">
  </div>

  <!-- Top-left title -->
  <img class="corner-title" src="assets/graphic/BLOCK_TYPE_TITLE.svg" alt="Title">
  <!-- Top-right UNESCO logo -->
  <img class="corner-logo" src="assets/graphic/UNESCO_LOGO.svg" alt="UNESCO">

  <div class="status-bar">
    <span class="status-zone" id="status-zone">Ready</span>
    <div class="progress-dots" id="progress-dots"></div>
    <div class="media-controls" id="media-controls">
      <button class="media-btn" id="btn-mute" title="Mute/Unmute">&#9834;</button>
      <button class="media-btn" id="btn-pause" title="Pause">&#10074;&#10074;</button>
      <button class="media-btn" id="btn-play" title="Play">&#9654;</button>
    </div>
  </div>

  <script src="js/table.js"></script>
</body>
</html>
