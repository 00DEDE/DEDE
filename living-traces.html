<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>Living Traces</title>
  <link rel="stylesheet" href="style.css">
  <style>
    @font-face {
      font-family: 'ABCMonumentGroteskMono';
      src: url('MICRO/ABCMonumentGroteskMono-Regular-Trial.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
    }
    body { background: #000; margin: 0; overflow: hidden; }
    @media (pointer: fine) { body, body * { cursor: none !important; } }
    .intro-logo {
      position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
      z-index: 50; pointer-events: none; opacity: 0; transition: opacity 1.2s ease;
    }
    .intro-logo.show { opacity: 1; }
    .intro-logo img { width: 180px; height: auto; display: block; }
    #chaos-canvas {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 49; pointer-events: none;
    }
    .circle-wrap {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      opacity: 0; transition: opacity 1.5s ease;
    }
    .circle-wrap.visible { opacity: 1; }
    .prompt {
      position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
      font-family: 'ABCMonumentGroteskMono', monospace; font-size: 0.75rem;
      letter-spacing: 0.08em; color: #fff; opacity: 0; transition: opacity 1.5s ease;
      text-transform: uppercase; user-select: none; pointer-events: none;
    }
    .prompt.visible { opacity: 0.5; }
  </style>
</head>
<body data-page="living-traces">

  <!-- Chaos canvas for rapid logo stamps -->
  <canvas id="chaos-canvas"></canvas>

  <!-- Final logo at top -->
  <div class="intro-logo" id="intro-logo">
    <img src="MICRO/MICRO_LOGO.svg" alt="Living Traces">
  </div>

  <!-- Circle -->
  <div class="circle-wrap" id="circle-wrap">
    <canvas id="poster-circle"></canvas>
  </div>

  <!-- Prompt -->
  <div class="prompt" id="prompt">complete the ellipse</div>

  <script>
    // ---- INTRO ANIMATION — rapid chaotic logo stamps ----
    (function() {
      var chaosCanvas = document.getElementById('chaos-canvas');
      var cCtx = chaosCanvas.getContext('2d');
      var logo = document.getElementById('intro-logo');
      var circleWrap = document.getElementById('circle-wrap');
      var prompt = document.getElementById('prompt');

      var IS_TABLET_CHAOS = window.innerWidth > 768 && window.innerWidth <= 1180;
      var CHAOS_DPR = IS_TABLET_CHAOS ? 1.5 : 2;
      chaosCanvas.width = window.innerWidth * CHAOS_DPR;
      chaosCanvas.height = window.innerHeight * CHAOS_DPR;
      chaosCanvas.style.width = window.innerWidth + 'px';
      chaosCanvas.style.height = window.innerHeight + 'px';
      cCtx.scale(CHAOS_DPR, CHAOS_DPR);

      // Load the MICRO logo SVG, tighten viewBox and make white
      var logoImg = new Image();
      fetch('MICRO/MICRO_LOGO.svg').then(function(r) { return r.text(); }).then(function(svg) {
        // Tighten viewBox to text path bounds
        var fixed = svg.replace('viewBox="0 0 288 288"', 'viewBox="10 120 270 45"');
        // Make all paths white
        fixed = fixed.replace('<svg ', '<svg fill="#fff" ');
        var dataUri = 'data:image/svg+xml,' + encodeURIComponent(fixed);
        logoImg.src = dataUri;
        document.querySelector('#intro-logo img').src = dataUri;
      });

      var W = window.innerWidth;
      var H = window.innerHeight;
      var startTime = null;
      var DURATION = 1500;
      var running = true;

      logoImg.onload = function() {
        var aspect = logoImg.naturalWidth / logoImg.naturalHeight;

        // Place one stamp at header logo position
        var headerW = 180;
        var headerH = headerW / aspect;
        var headerX = W / 2 - headerW / 2;
        var headerY = 30;
        cCtx.globalAlpha = 1;
        cCtx.drawImage(logoImg, headerX, headerY, headerW, headerH);

        function chaosLoop(timestamp) {
          if (!startTime) startTime = timestamp;
          var elapsed = timestamp - startTime;

          if (elapsed >= DURATION) {
            // Fill page completely white
            cCtx.fillStyle = '#fff';
            cCtx.fillRect(0, 0, W, H);

            // Fade white away to reveal black page + elements
            chaosCanvas.style.transition = 'opacity 1.2s ease';
            chaosCanvas.style.opacity = '0';
            logo.classList.add('show');
            circleWrap.classList.add('visible');
            prompt.classList.add('visible');

            setTimeout(function() {
              chaosCanvas.style.display = 'none';
            }, 1300);
            return;
          }

          cCtx.globalAlpha = 1;

          // Increase density over time to fill the page white
          var progress = elapsed / DURATION;
          var stampsPerFrame;
          if (progress < 0.4) {
            if (Math.random() < 0.3) { requestAnimationFrame(chaosLoop); return; }
            stampsPerFrame = 1 + Math.floor(Math.random() * 2);
          } else if (progress < 0.7) {
            stampsPerFrame = IS_TABLET_CHAOS ? 2 + Math.floor(Math.random() * 2) : 3 + Math.floor(Math.random() * 3);
          } else {
            stampsPerFrame = IS_TABLET_CHAOS ? 4 + Math.floor(Math.random() * 3) : 6 + Math.floor(Math.random() * 5);
          }

          for (var i = 0; i < stampsPerFrame; i++) {
            var roll = Math.random();
            var scale;
            if (progress < 0.5) {
              if (roll < 0.2) {
                scale = 0.1 + Math.random() * 0.3;
              } else if (roll < 0.7) {
                scale = 0.5 + Math.random() * 2;
              } else {
                scale = (W / 180) * (0.7 + Math.random() * 0.6);
              }
            } else {
              // Larger stamps to fill remaining gaps
              if (roll < 0.1) {
                scale = 0.3 + Math.random() * 0.5;
              } else if (roll < 0.4) {
                scale = 1 + Math.random() * 3;
              } else {
                scale = (W / 180) * (0.5 + Math.random() * 1.2);
              }
            }
            var w = 180 * scale;
            var h = w / aspect;
            var x = Math.random() * W - w / 2;
            var y = Math.random() * H - h / 2;

            cCtx.drawImage(logoImg, x, y, w, h);
          }

          requestAnimationFrame(chaosLoop);
        }
        requestAnimationFrame(chaosLoop);
      };
    })();

    // ---- CONCENTRIC DOT CIRCLE (audio-reactive) ----
    (function() {
      var canvas = document.getElementById('poster-circle');
      var ctx = canvas.getContext('2d');

      var IS_TABLET = window.innerWidth > 768 && window.innerWidth <= 1180;
      var DPR = IS_TABLET ? 1.5 : 2;

      function sizeCanvas() {
        // 2x original circle — extra room for audio expansion without clipping
        var s = Math.min(window.innerWidth, window.innerHeight) * 1.3;
        canvas.width = s * DPR;
        canvas.height = s * DPR;
        canvas.style.width = s + 'px';
        canvas.style.height = s + 'px';
        generateDots();
      }

      var dots = [];
      var CENTER_HOLE_PX = 50;
      var circleMaxR = 0;

      function generateDots() {
        dots = [];
        // Same visual circle size as original — canvas is larger for headroom
        circleMaxR = canvas.width / 2 * 0.425;
        var ringSpacing = IS_TABLET ? 7 : 5;
        var dotSpacing = IS_TABLET ? 4 : 3;
        var skipProb = IS_TABLET ? 0.35 : 0.2;
        var numRings = Math.floor((circleMaxR - CENTER_HOLE_PX) / ringSpacing);

        for (var ring = 0; ring < numRings; ring++) {
          var r = CENTER_HOLE_PX + ring * ringSpacing;
          var circumference = 2 * Math.PI * r;
          var numDots = Math.floor(circumference / dotSpacing);

          for (var d = 0; d < numDots; d++) {
            if (Math.random() < skipProb) continue;
            var baseAngle = (d / numDots) * Math.PI * 2;
            var radiusNoise = (Math.random() - 0.5) * 1.2;
            var angleNoise = (Math.random() - 0.5) * (0.4 / (ring + 5));

            dots.push({
              baseR: r + radiusNoise,
              baseAngle: baseAngle + angleNoise,
              ring: ring,
              phase: Math.random() * Math.PI * 2,
              speed: 0.2 + Math.random() * 0.6
            });
          }
        }
      }

      sizeCanvas();
      window.addEventListener('resize', sizeCanvas);

      var time = 0;
      var breathTarget = 1;
      var breathCurrent = 1;
      var breathTimer = 0;
      var breathInterval = 60 + Math.random() * 80;
      var dispersing = false;
      var disperseTime = 0;

      // ---- AUDIO ----
      var audio = { volume: 0, bass: 0, mid: 0, treble: 0 };
      var smoothAudio = { volume: 0, bass: 0, mid: 0, treble: 0 };
      var analyser = null;
      var freqData = null;
      var audioReady = false;

      function initAudio() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;

        navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
          var audioCtx = new (window.AudioContext || window.webkitAudioContext)();

          if (audioCtx.state === 'suspended') {
            var resume = function() {
              audioCtx.resume();
              document.removeEventListener('click', resume);
              document.removeEventListener('touchstart', resume);
            };
            document.addEventListener('click', resume);
            document.addEventListener('touchstart', resume);
            audioCtx.resume();
          }

          var source = audioCtx.createMediaStreamSource(stream);
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 256;
          analyser.smoothingTimeConstant = 0.88;
          source.connect(analyser);
          freqData = new Uint8Array(analyser.frequencyBinCount);
          audioReady = true;

          var promptEl = document.getElementById('prompt');
          var SR_AVAILABLE = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
          promptEl.textContent = SR_AVAILABLE ? 'say hello' : 'tap to continue';

          initSpeechRecognition();
        }).catch(function() {
          // Mic denied — click fallback remains
          var promptEl = document.getElementById('prompt');
          promptEl.textContent = 'tap to continue';
        });
      }

      function updateAudio() {
        if (!audioReady) return;
        analyser.getByteFrequencyData(freqData);
        var len = freqData.length;
        var bassN = Math.floor(len * 0.15);
        var midN = Math.floor(len * 0.35);
        var bassSum = 0, midSum = 0, trebSum = 0, total = 0;
        for (var i = 0; i < len; i++) {
          total += freqData[i];
          if (i < bassN) bassSum += freqData[i];
          else if (i < bassN + midN) midSum += freqData[i];
          else trebSum += freqData[i];
        }
        audio.volume = total / len / 255;
        audio.bass = bassSum / Math.max(1, bassN) / 255;
        audio.mid = midSum / Math.max(1, midN) / 255;
        audio.treble = trebSum / Math.max(1, len - bassN - midN) / 255;

        // Slow smooth — holds shape so user can see their voice in the circle
        smoothAudio.volume += (audio.volume - smoothAudio.volume) * 0.07;
        smoothAudio.bass += (audio.bass - smoothAudio.bass) * 0.07;
        smoothAudio.mid += (audio.mid - smoothAudio.mid) * 0.05;
        smoothAudio.treble += (audio.treble - smoothAudio.treble) * 0.09;
      }

      // ---- SPEECH RECOGNITION ----
      var greetings = [
        'hello', 'hi', 'hey', 'howdy', 'greetings',
        'hola', 'buenos',
        'bonjour', 'salut', 'bonsoir',
        'hallo', 'guten',
        'ciao', 'buongiorno', 'salve',
        'ola',
        'konnichiwa', 'konnichi', 'ohayo', 'moshi moshi',
        'nihao', 'ni hao', 'nee how', 'nei hou', 'lei ho',
        'annyeong', 'anyong', 'annyeonghaseyo',
        'namaste', 'namaskar',
        'marhaba', 'salam', 'salaam', 'ahlan',
        'shalom',
        'jambo', 'habari',
        'aloha',
        'sawadee', 'sawasdee',
        'privet',
        'merhaba',
        'yassou', 'yasu',
        'sawubona',
        'kia ora',
        'helo', 'bore da'
      ];

      function initSpeechRecognition() {
        var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) return;

        var recognition = new SR();
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onresult = function(event) {
          for (var r = event.resultIndex; r < event.results.length; r++) {
            var transcript = event.results[r][0].transcript.toLowerCase().trim();
            for (var g = 0; g < greetings.length; g++) {
              if (transcript.indexOf(greetings[g]) !== -1) {
                triggerDispersion();
                recognition.stop();
                return;
              }
            }
          }
        };

        recognition.onend = function() {
          if (!dispersing) {
            try { recognition.start(); } catch(e) {}
          }
        };

        recognition.onerror = function(event) {
          if (event.error === 'no-speech' || event.error === 'aborted') return;
        };

        try { recognition.start(); } catch(e) {}
      }

      // ---- DISPERSION ----
      function triggerDispersion() {
        if (dispersing) return;
        dispersing = true;
        for (var j = 0; j < dots.length; j++) {
          dots[j].disperseSpeed = 0.3 + Math.random() * 2.5;
          dots[j].disperseDelay = Math.random() * 0.6;
          dots[j].disperseDrift = (Math.random() - 0.5) * 0.4;
        }
        var logoEl = document.getElementById('intro-logo');
        var promptEl = document.getElementById('prompt');
        logoEl.style.transition = 'opacity 1.5s ease';
        logoEl.style.opacity = '0';
        promptEl.style.transition = 'opacity 1.5s ease';
        promptEl.style.opacity = '0';
        setTimeout(function() {
          window.location.href = 'living-traces-home.html';
        }, 2500);
      }

      // iOS/iPad Safari requires a user gesture before getUserMedia
      // Try immediately for desktop; also retry on first touch/click for mobile
      initAudio();
      var gestureRetry = function() {
        if (!audioReady) initAudio();
        document.removeEventListener('touchstart', gestureRetry);
        document.removeEventListener('click', gestureRetry);
      };
      document.addEventListener('touchstart', gestureRetry, { passive: true });
      document.addEventListener('click', gestureRetry);

      // ---- ANIMATION LOOP ----
      function loop() {
        var size = canvas.width;
        var cx = size / 2;
        var cy = size / 2;

        ctx.clearRect(0, 0, size, size);
        time += 0.02;

        updateAudio();

        // Dispersion mode — dots fly outward and fade
        if (dispersing) {
          disperseTime += 0.016;
          ctx.fillStyle = '#fff';
          for (var i = 0; i < dots.length; i++) {
            var d = dots[i];
            var t = Math.max(0, disperseTime - d.disperseDelay);
            if (t <= 0) {
              var r = d.baseR * breathCurrent;
              var x = cx + Math.cos(d.baseAngle) * r;
              var y = cy + Math.sin(d.baseAngle) * r;
              ctx.globalAlpha = 1;
              ctx.beginPath();
              ctx.arc(x, y, 0.8, 0, Math.PI * 2);
              ctx.fill();
            } else {
              var r = d.baseR + d.disperseSpeed * t * t * 80;
              var angle = d.baseAngle + d.disperseDrift * t;
              var x = cx + Math.cos(angle) * r;
              var y = cy + Math.sin(angle) * r;
              var alpha = Math.max(0, 1 - t / 1.8);
              if (alpha <= 0) continue;
              ctx.globalAlpha = alpha;
              ctx.beginPath();
              ctx.arc(x, y, Math.max(0.2, 0.8 - t * 0.2), 0, Math.PI * 2);
              ctx.fill();
            }
          }
          ctx.globalAlpha = 1;
          requestAnimationFrame(loop);
          return;
        }

        // Breathing
        breathTimer++;
        if (breathTimer >= breathInterval) {
          breathTimer = 0;
          breathInterval = 40 + Math.random() * 100;
          breathTarget = 0.96 + Math.random() * 0.1;
        }
        breathCurrent += (breathTarget - breathCurrent) * 0.012;

        // Audio-reactive breathing boost — large so voice visibly swells the circle
        var audioBreath = 1 + smoothAudio.volume * 0.5;

        ctx.fillStyle = '#fff';
        ctx.globalAlpha = 1;

        var pulseWave = time * 0.6;

        for (var i = 0; i < dots.length; i++) {
          var d = dots[i];
          var rFactor = d.baseR / circleMaxR;
          var ringPhase = rFactor * Math.PI * 1.5;
          var pulse = Math.sin(pulseWave - ringPhase);
          var amplitude = 0.06 + rFactor * 0.08;
          var r = d.baseR * breathCurrent * audioBreath * (1 + pulse * amplitude);
          var wobble = Math.sin(time * d.speed + d.phase) * 0.3;
          r += wobble;

          // Audio-reactive displacement — dramatic so each voice reshapes the circle
          var audioPush = smoothAudio.bass * (1 - rFactor) * 45
                        + smoothAudio.treble * rFactor * 35;
          r += audioPush;

          var angle = d.baseAngle;
          // Mid frequencies → angular flow in middle rings
          var midFactor = 1 - Math.abs(rFactor - 0.5) * 2;
          angle += smoothAudio.mid * midFactor * 0.18 * Math.sin(time * 1.5 + d.phase);

          var x = cx + Math.cos(angle) * r;
          var y = cy + Math.sin(angle) * r;

          ctx.beginPath();
          ctx.arc(x, y, 0.8, 0, Math.PI * 2);
          ctx.fill();
        }

        requestAnimationFrame(loop);
      }
      loop();

      // ---- CLICK FALLBACK — works if mic/speech unavailable ----
      // On touch devices (iPad) and browsers without SpeechRecognition the entire
      // circle area acts as the advance hit-target instead of a tiny 25px dot.
      if (window.matchMedia('(pointer: fine)').matches) canvas.style.cursor = 'none';
      var SR_AVAILABLE = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
      var IS_TOUCH = 'ontouchstart' in window;
      canvas.addEventListener('click', function(e) {
        if (dispersing) return;
        var rect = canvas.getBoundingClientRect();
        var clickX = e.clientX - rect.left - rect.width / 2;
        var clickY = e.clientY - rect.top - rect.height / 2;
        var dist = Math.sqrt(clickX * clickX + clickY * clickY);
        var hitRadius = (IS_TOUCH || !SR_AVAILABLE) ? rect.width / 2 : 25;
        if (dist <= hitRadius) triggerDispersion();
      });
    })();
  </script>
  <script src="script.js"></script>
  <script>
    // ---- CURSOR — mini concentric ring disc (desktop only) ----
    (function() {
      if (!window.matchMedia('(pointer: fine)').matches) return;

      const canvas = document.createElement('canvas');
      canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;';
      document.body.appendChild(canvas);
      const ctx = canvas.getContext('2d');

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      const CURSOR_R = 25;
      const CENTER_HOLE = 2;
      const cursorDots = [];
      var ringSpacing = 2.5;
      var numRings = Math.floor((CURSOR_R - CENTER_HOLE) / ringSpacing);
      for (var ring = 0; ring < numRings; ring++) {
        var r = CENTER_HOLE + ring * ringSpacing;
        var circ = 2 * Math.PI * r;
        var num = Math.floor(circ / 1.8);
        for (var d = 0; d < num; d++) {
          if (Math.random() < 0.2) continue;
          var baseAngle = (d / num) * Math.PI * 2;
          var rNoise = (Math.random() - 0.5) * 0.6;
          var aNoise = (Math.random() - 0.5) * (0.3 / (ring + 3));
          cursorDots.push({
            baseR: r + rNoise,
            baseAngle: baseAngle + aNoise,
            phase: Math.random() * Math.PI * 2,
            speed: 0.3 + Math.random() * 0.5
          });
        }
      }

      var mouseX = -200, mouseY = -200;
      var time = 0;
      var breathTarget = 1;
      var breathCurrent = 1;
      var breathTimer = 0;
      var breathInterval = 60 + Math.random() * 60;

      document.addEventListener('mousemove', function(e) {
        mouseX = e.clientX;
        mouseY = e.clientY;
      });

      var clickMarker = null;
      document.addEventListener('click', function(e) {
        clickMarker = { x: e.clientX, y: e.clientY, life: 1 };
      });

      function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        time += 0.025;

        breathTimer++;
        if (breathTimer >= breathInterval) {
          breathTimer = 0;
          breathInterval = 50 + Math.random() * 80;
          breathTarget = 0.93 + Math.random() * 0.14;
        }
        breathCurrent += (breathTarget - breathCurrent) * 0.015;

        ctx.fillStyle = '#fff';
        ctx.globalAlpha = 1;

        var pulseWave = time * 0.5;

        for (var i = 0; i < cursorDots.length; i++) {
          var d = cursorDots[i];
          var rFactor = d.baseR / CURSOR_R;
          var ringPhase = rFactor * Math.PI * 1.4;
          var pulse = Math.sin(pulseWave - ringPhase);
          var amplitude = 0.04 + rFactor * 0.06;
          var r = d.baseR * breathCurrent * (1 + pulse * amplitude);
          var wobble = Math.sin(time * d.speed + d.phase) * 0.3;
          r += wobble;
          var angle = d.baseAngle;
          var x = mouseX + Math.cos(angle) * r;
          var y = mouseY + Math.sin(angle) * r;

          ctx.beginPath();
          ctx.arc(x, y, 0.7, 0, Math.PI * 2);
          ctx.fill();
        }

        if (clickMarker) {
          clickMarker.life -= 0.03;
          if (clickMarker.life <= 0) {
            clickMarker = null;
          } else {
            var cx = clickMarker.x, cy = clickMarker.y;
            ctx.globalAlpha = clickMarker.life;
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1;
            var arm = 14;
            ctx.beginPath();
            ctx.moveTo(cx - arm, cy);
            ctx.lineTo(cx - 4, cy);
            ctx.moveTo(cx + 4, cy);
            ctx.lineTo(cx + arm, cy);
            ctx.moveTo(cx, cy - arm);
            ctx.lineTo(cx, cy - 4);
            ctx.moveTo(cx, cy + 4);
            ctx.lineTo(cx, cy + arm);
            ctx.stroke();
          }
        }

        ctx.globalAlpha = 1;
        requestAnimationFrame(loop);
      }
      loop();
    })();
  </script>
</body>
</html>
