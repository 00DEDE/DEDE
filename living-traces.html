<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Living Traces</title>
  <link rel="stylesheet" href="style.css">
  <style>
    @font-face {
      font-family: 'ABCMonumentGroteskMono';
      src: url('MICRO/ABCMonumentGroteskMono-Regular-Trial.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
    }
    body {
      background: #000;
      cursor: none !important;
      margin: 0;
      overflow: hidden;
    }
    body * { cursor: none !important; }

    /* Full-bleed logo */
    /* Final logo at top */
    .intro-logo {
      position: fixed;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      pointer-events: none;
      opacity: 0;
    }
    .intro-logo.show {
      opacity: 1;
    }
    .intro-logo img {
      width: 180px;
      height: auto;
      display: block;
      filter: invert(1);
    }
    /* Chaos canvas for rapid logo stamps */
    #chaos-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 49;
      pointer-events: none;
    }

    /* Circle container */
    .circle-wrap {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0;
      transition: opacity 1.5s ease;
    }
    .circle-wrap.visible {
      opacity: 1;
    }

    /* Bottom prompt */
    .prompt {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'ABCMonumentGroteskMono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      color: #fff;
      opacity: 0;
      transition: opacity 1.5s ease;
      text-transform: uppercase;
      user-select: none;
      pointer-events: none;
    }
    .prompt.visible {
      opacity: 0.5;
    }
  </style>
</head>
<body data-page="living-traces">

  <!-- Chaos canvas for rapid logo stamps -->
  <canvas id="chaos-canvas"></canvas>

  <!-- Final logo at top -->
  <div class="intro-logo" id="intro-logo">
    <img src="MICRO/MICRO_LOGO.svg" alt="Living Traces">
  </div>

  <!-- Circle -->
  <div class="circle-wrap" id="circle-wrap">
    <canvas id="poster-circle"></canvas>
  </div>

  <!-- Prompt -->
  <div class="prompt" id="prompt">complete the ellipse</div>

  <script>
    // ---- INTRO ANIMATION — rapid chaotic logo stamps ----
    (function() {
      var chaosCanvas = document.getElementById('chaos-canvas');
      var cCtx = chaosCanvas.getContext('2d');
      var logo = document.getElementById('intro-logo');
      var circleWrap = document.getElementById('circle-wrap');
      var prompt = document.getElementById('prompt');

      chaosCanvas.width = window.innerWidth * 2;
      chaosCanvas.height = window.innerHeight * 2;
      chaosCanvas.style.width = window.innerWidth + 'px';
      chaosCanvas.style.height = window.innerHeight + 'px';
      cCtx.scale(2, 2);

      // Load the MICRO logo SVG as an image, inverted to white
      var logoImg = new Image();
      // Fetch the SVG and inject white fill
      fetch('MICRO/MICRO_LOGO.svg').then(function(r) { return r.text(); }).then(function(svg) {
        var whiteSvg = svg.replace(/<style>[\s\S]*?<\/style>/, '<style>.st0 { fill: #fff; font-family: sans-serif; font-size: 48.66px; letter-spacing: .05em; }</style>');
        logoImg.src = 'data:image/svg+xml,' + encodeURIComponent(whiteSvg);
      });

      var W = window.innerWidth;
      var H = window.innerHeight;
      var startTime = null;
      var DURATION = 3000;
      var running = true;

      logoImg.onload = function() {
        var aspect = logoImg.width / logoImg.height;
        var frameCount = 0;

        function chaosLoop(timestamp) {
          if (!startTime) startTime = timestamp;
          var elapsed = timestamp - startTime;

          if (elapsed >= DURATION) {
            cCtx.clearRect(0, 0, W, H);
            chaosCanvas.style.display = 'none';
            logo.classList.add('show');
            setTimeout(function() {
              circleWrap.classList.add('visible');
            }, 500);
            setTimeout(function() {
              prompt.classList.add('visible');
            }, 1500);
            return;
          }

          frameCount++;

          // Skip frames randomly — creates bursts and pauses
          if (Math.random() < 0.4) {
            requestAnimationFrame(chaosLoop);
            return;
          }

          // Only 1-2 stamps per active frame — sparse, not filling the screen
          var stampsPerFrame = Math.random() < 0.7 ? 1 : 2;
          for (var i = 0; i < stampsPerFrame; i++) {
            var scale = 0.3 + Math.random() * 2.5;
            var w = 180 * scale;
            var h = w / aspect;
            var x = Math.random() * W * 0.9 + W * 0.05 - w / 2;
            var y = Math.random() * H * 0.9 + H * 0.05 - h / 2;

            cCtx.globalAlpha = 0.4 + Math.random() * 0.6;
            cCtx.drawImage(logoImg, x, y, w, h);
          }

          requestAnimationFrame(chaosLoop);
        }
        requestAnimationFrame(chaosLoop);
      };
    })();

    // ---- CONCENTRIC DOT CIRCLE ----
    (function() {
      var canvas = document.getElementById('poster-circle');
      var ctx = canvas.getContext('2d');

      function sizeCanvas() {
        var s = Math.min(window.innerWidth, window.innerHeight) * 0.65;
        canvas.width = s * 2;
        canvas.height = s * 2;
        canvas.style.width = s + 'px';
        canvas.style.height = s + 'px';
        generateDots();
      }

      var dots = [];
      var CENTER_HOLE_PX = 50;

      function generateDots() {
        dots = [];
        var size = canvas.width;
        var maxR = size / 2 * 0.85;
        var ringSpacing = 5;
        var numRings = Math.floor((maxR - CENTER_HOLE_PX) / ringSpacing);

        for (var ring = 0; ring < numRings; ring++) {
          var r = CENTER_HOLE_PX + ring * ringSpacing;
          var circumference = 2 * Math.PI * r;
          var numDots = Math.floor(circumference / 3);

          for (var d = 0; d < numDots; d++) {
            if (Math.random() < 0.2) continue;
            var baseAngle = (d / numDots) * Math.PI * 2;
            var radiusNoise = (Math.random() - 0.5) * 1.2;
            var angleNoise = (Math.random() - 0.5) * (0.4 / (ring + 5));

            dots.push({
              baseR: r + radiusNoise,
              baseAngle: baseAngle + angleNoise,
              ring: ring,
              phase: Math.random() * Math.PI * 2,
              speed: 0.2 + Math.random() * 0.6
            });
          }
        }
      }

      sizeCanvas();
      window.addEventListener('resize', sizeCanvas);

      var time = 0;
      var breathTarget = 1;
      var breathCurrent = 1;
      var breathTimer = 0;
      var breathInterval = 60 + Math.random() * 80;

      function loop() {
        var size = canvas.width;
        var cx = size / 2;
        var cy = size / 2;

        ctx.clearRect(0, 0, size, size);
        time += 0.02;

        breathTimer++;
        if (breathTimer >= breathInterval) {
          breathTimer = 0;
          breathInterval = 40 + Math.random() * 100;
          breathTarget = 0.96 + Math.random() * 0.1;
        }
        breathCurrent += (breathTarget - breathCurrent) * 0.012;

        ctx.fillStyle = '#fff';
        ctx.globalAlpha = 1;

        var pulseWave = time * 0.6;

        for (var i = 0; i < dots.length; i++) {
          var d = dots[i];
          var maxR = size / 2;
          var rFactor = d.baseR / maxR;
          var ringPhase = rFactor * Math.PI * 1.5;
          var pulse = Math.sin(pulseWave - ringPhase);
          var amplitude = 0.06 + rFactor * 0.08;
          var r = d.baseR * breathCurrent * (1 + pulse * amplitude);
          var wobble = Math.sin(time * d.speed + d.phase) * 0.3;
          r += wobble;
          var angle = d.baseAngle;
          var x = cx + Math.cos(angle) * r;
          var y = cy + Math.sin(angle) * r;

          ctx.beginPath();
          ctx.arc(x, y, 0.8, 0, Math.PI * 2);
          ctx.fill();
        }

        requestAnimationFrame(loop);
      }
      loop();

      // ---- CLICK INSIDE CENTER HOLE → navigate ----
      canvas.style.cursor = 'none';
      canvas.addEventListener('click', function(e) {
        var rect = canvas.getBoundingClientRect();
        // Click position relative to canvas center (in CSS pixels)
        var clickX = e.clientX - rect.left - rect.width / 2;
        var clickY = e.clientY - rect.top - rect.height / 2;
        var dist = Math.sqrt(clickX * clickX + clickY * clickY);
        // Center hole visual radius = 50 canvas px / 2 (retina) = 25 CSS px
        if (dist <= 25) {
          window.location.href = 'living-traces-home.html';
        }
      });
    })();
  </script>
  <script src="script.js"></script>
  <script>
    // ---- CURSOR — mini concentric ring disc ----
    (function() {
      const canvas = document.createElement('canvas');
      canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;';
      document.body.appendChild(canvas);
      const ctx = canvas.getContext('2d');

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      const CURSOR_R = 25;
      const CENTER_HOLE = 2;
      const cursorDots = [];
      var ringSpacing = 2.5;
      var numRings = Math.floor((CURSOR_R - CENTER_HOLE) / ringSpacing);
      for (var ring = 0; ring < numRings; ring++) {
        var r = CENTER_HOLE + ring * ringSpacing;
        var circ = 2 * Math.PI * r;
        var num = Math.floor(circ / 1.8);
        for (var d = 0; d < num; d++) {
          if (Math.random() < 0.2) continue;
          var baseAngle = (d / num) * Math.PI * 2;
          var rNoise = (Math.random() - 0.5) * 0.6;
          var aNoise = (Math.random() - 0.5) * (0.3 / (ring + 3));
          cursorDots.push({
            baseR: r + rNoise,
            baseAngle: baseAngle + aNoise,
            phase: Math.random() * Math.PI * 2,
            speed: 0.3 + Math.random() * 0.5
          });
        }
      }

      var mouseX = -200, mouseY = -200;
      var time = 0;
      var breathTarget = 1;
      var breathCurrent = 1;
      var breathTimer = 0;
      var breathInterval = 60 + Math.random() * 60;

      document.addEventListener('mousemove', function(e) {
        mouseX = e.clientX;
        mouseY = e.clientY;
      });

      var clickMarker = null;
      document.addEventListener('click', function(e) {
        clickMarker = { x: e.clientX, y: e.clientY, life: 1 };
      });

      function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        time += 0.025;

        breathTimer++;
        if (breathTimer >= breathInterval) {
          breathTimer = 0;
          breathInterval = 50 + Math.random() * 80;
          breathTarget = 0.93 + Math.random() * 0.14;
        }
        breathCurrent += (breathTarget - breathCurrent) * 0.015;

        ctx.fillStyle = '#fff';
        ctx.globalAlpha = 1;

        var pulseWave = time * 0.5;

        for (var i = 0; i < cursorDots.length; i++) {
          var d = cursorDots[i];
          var rFactor = d.baseR / CURSOR_R;
          var ringPhase = rFactor * Math.PI * 1.4;
          var pulse = Math.sin(pulseWave - ringPhase);
          var amplitude = 0.04 + rFactor * 0.06;
          var r = d.baseR * breathCurrent * (1 + pulse * amplitude);
          var wobble = Math.sin(time * d.speed + d.phase) * 0.3;
          r += wobble;
          var angle = d.baseAngle;
          var x = mouseX + Math.cos(angle) * r;
          var y = mouseY + Math.sin(angle) * r;

          ctx.beginPath();
          ctx.arc(x, y, 0.7, 0, Math.PI * 2);
          ctx.fill();
        }

        if (clickMarker) {
          clickMarker.life -= 0.03;
          if (clickMarker.life <= 0) {
            clickMarker = null;
          } else {
            var cx = clickMarker.x, cy = clickMarker.y;
            ctx.globalAlpha = clickMarker.life;
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1;
            var arm = 14;
            ctx.beginPath();
            ctx.moveTo(cx - arm, cy);
            ctx.lineTo(cx - 4, cy);
            ctx.moveTo(cx + 4, cy);
            ctx.lineTo(cx + arm, cy);
            ctx.moveTo(cx, cy - arm);
            ctx.lineTo(cx, cy - 4);
            ctx.moveTo(cx, cy + 4);
            ctx.lineTo(cx, cy + arm);
            ctx.stroke();
          }
        }

        ctx.globalAlpha = 1;
        requestAnimationFrame(loop);
      }
      loop();
    })();
  </script>
</body>
</html>
