<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 288 288">
  <style>rect { fill: #2490cf; }</style>

  <!-- Center cross -->
